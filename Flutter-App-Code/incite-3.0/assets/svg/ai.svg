<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue gradient definition -->
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6BA3F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7FED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle border -->
  <circle cx="12" cy="12" r="10" stroke="url(#aiGradient)" stroke-width="1.5" fill="none"/>

  <!-- Four-pointed star with curved concave edges (sparkle shape) -->
  <path d="M 12 4
           Q 10.5 9 7 12
           Q 10.5 15 12 20
           Q 13.5 15 17 12
           Q 13.5 9 12 4 Z"
        fill="url(#aiGradient)"/>
</svg>
